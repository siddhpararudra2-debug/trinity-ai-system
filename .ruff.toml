target-version = "py311"
line-length = 100

src = [
    "artifacts/api-server",
    "workers",
    "tests"
]

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",   # line-length violations
    "B008",   # FastAPI Depends() in default arguments
    "RUF001", # Ambiguous characters (math symbols, multiplication signs in prompts)
    "RUF002", # Ambiguous characters in docstrings
    "RUF003", # Ambiguous characters in comments
]

[lint.per-file-ignores]
"tests/*" = [
    "B017",   # assertRaises(Exception) in test cases
    "F401",   # unused imports in test fixtures
    "E712",   # comparison to True/False in SQLAlchemy queries
]
"workers/fusion/*" = [
    "N999",
    "S102",
    "BLE001",
]
"alembic/*" = [
    "F401",
]

[lint.isort]
known-first-party = ["app"]
