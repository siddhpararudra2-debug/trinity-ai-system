[project]
name = "trinity"
version = "1.0.0"
description = "Trinity AI — Engineering Operating System (LLM-independent core, V1)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "sympy>=1.12",
    "numpy>=1.26",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "openai>=1.0",
    "anthropic>=0.34",
    "python-multipart>=0.0.9",
    # POST /api/login mints and validates JWTs (import jwt).
    "pyjwt>=2.8",
    # src/main.py loads .env.dummy for the zero-code-edit runtime config.
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# STEP export (AP214 faceted B-rep via OpenCascade). ~1 GB of wheels and a
# slow first import, so it is an extra rather than a core requirement.
# Without it every path stays honest: the catalog reports step as
# unavailable with a reason, and STL/GLB/JSON are unaffected.
cad = ["cadquery>=2.8"]
# M18.3: Python vision fallback for image_inspect (Pillow) and
# document_parse (pypdf). Both are light; OCR still needs a system
# tesseract binary and stays native-only. Without the extra the engine
# refuses with an install hint instead of pretending.
vision = ["pillow>=10.0", "pypdf>=4.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "UP", "BLE", "RUF022", "RUF100"]
ignore = ["RUF100"]
