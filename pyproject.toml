[project]
name = "trinity"
version = "1.0.0"
description = "Trinity AI — Engineering Operating System (LLM-independent core, V1)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "sympy>=1.12",
    "numpy>=1.26",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "openai>=1.0",
    "anthropic>=0.34",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "UP", "BLE", "RUF022", "RUF100"]
ignore = ["RUF100"]
