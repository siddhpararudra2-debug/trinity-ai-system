    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const frames = Array.from(document.querySelectorAll("iframe"));
            const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
            const lenis = typeof Lenis === "function" ? new Lenis({
                autoRaf: true,
                smoothWheel: true,
                syncTouch: true,
                wheelMultiplier: 0.8,
                lerp: 0.08
            }) : null;
            let isTransitioning = false;
            let transitionTimer;

            function moveToFrame(index) {
                if (isTransitioning || index < 0 || index >= frames.length) return;

                isTransitioning = true;
                const target = frames[index];
                let transitionFinished = false;
                let transitionTimer;

                if (!reduceMotion) target.classList.add("is-entering");

                function finishTransition() {
                    if (transitionFinished) return;
                    transitionFinished = true;
                    clearTimeout(transitionTimer);
                    window.removeEventListener("scrollend", finishTransition);
                    target.classList.remove("is-entering");
                    target.contentWindow.postMessage({ type: "trinity-slide-enter" }, "*");
                    isTransitioning = false;
                }

                if (!reduceMotion) {
                    window.addEventListener("scrollend", finishTransition);
                }

                window.scrollTo({
                    top: target.offsetTop,
                    behavior: reduceMotion ? "auto" : "smooth"
                });

                if (reduceMotion) {
                    finishTransition();
                } else {
                    transitionTimer = setTimeout(finishTransition, 1600);
                }
            }
            window.addEventListener("message", function(event) {
                const index = frames.findIndex(frame => frame.contentWindow === event.source);
                const message = event.data;
                if (index < 0 || !message || message.type !== "trinity-page-transition") return;
                if (message.direction !== 1 && message.direction !== -1) return;
                moveToFrame(index + message.direction);
            });
        });

(function() {
    if (window.top === window.self) return;

    let touchStartY = null;

    function isAtBoundary(direction, target) {
        const root = document.scrollingElement;
        if (!root) return false;
        const pageAtBoundary = direction &gt; 0
            ? root.scrollTop + window.innerHeight &gt;= root.scrollHeight - 2
            : root.scrollTop &lt;= 2;
        if (!pageAtBoundary) return false;

        let element = target instanceof Element ? target : target.parentElement;
        while (element &amp;&amp; element !== document.body &amp;&amp; element !== document.documentElement) {
            const overflowY = getComputedStyle(element).overflowY;
            if ((overflowY === &quot;auto&quot; || overflowY === &quot;scroll&quot;) &amp;&amp; element.scrollHeight &gt; element.clientHeight + 2) {
                const canContinue = direction &gt; 0
                    ? element.scrollTop + element.clientHeight &lt; element.scrollHeight - 2
                    : element.scrollTop &gt; 2;
                if (canContinue) return false;
            }
            element = element.parentElement;
        }
        return true;
    }

    function requestTransition(direction) {
        window.parent.postMessage({ type: &quot;trinity-page-transition&quot;, direction: direction }, &quot;*&quot;);
    }

    document.addEventListener(&quot;wheel&quot;, function(event) {
        if (event.ctrlKey || Math.abs(event.deltaY) &lt; 20) return;
        const direction = event.deltaY &gt; 0 ? 1 : -1;
        if (!isAtBoundary(direction, event.target)) return;
        event.preventDefault();
        requestTransition(direction);
    }, { passive: false });

    document.addEventListener(&quot;touchstart&quot;, function(event) {
        touchStartY = event.touches.length === 1 ? event.touches[0].clientY : null;
    }, { passive: true });

    document.addEventListener(&quot;touchend&quot;, function(event) {
        if (touchStartY === null || event.changedTouches.length === 0) return;
        const distance = touchStartY - event.changedTouches[0].clientY;
        touchStartY = null;
        if (Math.abs(distance) &lt; 48) return;
        const direction = distance &gt; 0 ? 1 : -1;
        if (!isAtBoundary(direction, event.target)) return;
        event.preventDefault();
        requestTransition(direction);
    }, { passive: false });
})();

&lt;script&gt;
(function() {
    const reduceMotion = window.matchMedia(&quot;(prefers-reduced-motion: reduce)&quot;);
    let replayTimer;

    window.addEventListener(&quot;message&quot;, function(event) {
        if (event.source !== window.parent) return;
        if (!event.data || event.data.type !== &quot;trinity-slide-enter&quot; || reduceMotion.matches) return;

        const shell = document.querySelector(&quot;.app-shell&quot;);
        if (!shell) return;

        clearTimeout(replayTimer);
        shell.classList.remove(&quot;trinity-slide-replay&quot;);
        void shell.offsetWidth;
        shell.classList.add(&quot;trinity-slide-replay&quot;);
        replayTimer = setTimeout(function() {
            shell.classList.remove(&quot;trinity-slide-replay&quot;);
        }, 1500);
    });
})();

&lt;script&gt;
(function() {
    function observeVideoSection() {
        const section = document.querySelector(&quot;.video-wrap&quot;);
        if (!section) return false;
        const observer = new IntersectionObserver(function(entries) {
            if (entries.some(function(entry) { return entry.isIntersecting; })) {
                section.classList.add(&quot;is-caption-visible&quot;);
                observer.disconnect();
            }
        }, { threshold: 0.2 });
        observer.observe(section);
        return true;
    }

    if (!observeVideoSection()) {
        const observer = new MutationObserver(function() {
            if (observeVideoSection()) observer.disconnect();
        });
        observer.observe(document.body, { childList: true, subtree: true });
    }
})();

(function() {
    if (window.top === window.self) return;

    let touchStartY = null;

    function isAtBoundary(direction, target) {
        const root = document.scrollingElement;
        if (!root) return false;
        const pageAtBoundary = direction &gt; 0
            ? root.scrollTop + window.innerHeight &gt;= root.scrollHeight - 2
            : root.scrollTop &lt;= 2;
        if (!pageAtBoundary) return false;

        let element = target instanceof Element ? target : target.parentElement;
        while (element &amp;&amp; element !== document.body &amp;&amp; element !== document.documentElement) {
            const overflowY = getComputedStyle(element).overflowY;
            if ((overflowY === &quot;auto&quot; || overflowY === &quot;scroll&quot;) &amp;&amp; element.scrollHeight &gt; element.clientHeight + 2) {
                const canContinue = direction &gt; 0
                    ? element.scrollTop + element.clientHeight &lt; element.scrollHeight - 2
                    : element.scrollTop &gt; 2;
                if (canContinue) return false;
            }
            element = element.parentElement;
        }
        return true;
    }

    function requestTransition(direction) {
        window.parent.postMessage({ type: &quot;trinity-page-transition&quot;, direction: direction }, &quot;*&quot;);
    }

    document.addEventListener(&quot;wheel&quot;, function(event) {
        if (event.ctrlKey || Math.abs(event.deltaY) &lt; 20) return;
        const direction = event.deltaY &gt; 0 ? 1 : -1;
        if (!isAtBoundary(direction, event.target)) return;
        event.preventDefault();
        requestTransition(direction);
    }, { passive: false });

    document.addEventListener(&quot;touchstart&quot;, function(event) {
        touchStartY = event.touches.length === 1 ? event.touches[0].clientY : null;
    }, { passive: true });

    document.addEventListener(&quot;touchend&quot;, function(event) {
        if (touchStartY === null || event.changedTouches.length === 0) return;
        const distance = touchStartY - event.changedTouches[0].clientY;
        touchStartY = null;
        if (Math.abs(distance) &lt; 48) return;
        const direction = distance &gt; 0 ? 1 : -1;
        if (!isAtBoundary(direction, event.target)) return;
        event.preventDefault();
        requestTransition(direction);
    }, { passive: false });
})();
