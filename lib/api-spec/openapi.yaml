openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Trinity AI Engineering OS API
servers:
  - url: /api
    description: Base API path
security:
  - TrinityApiKey: []
  - BearerAuth: []
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Account registration and bearer authentication
  - name: chat
    description: Unified Trinity chat
  - name: conversations
    description: Conversation management
  - name: engines
    description: Trinity engine endpoints
  - name: designs
    description: Typed CAD and PCB design jobs
  - name: firmware
    description: Free, target-specific firmware generation
  - name: vision
    description: Image OCR and LaTeX extraction
  - name: collab
    description: Collaboration sessions
  - name: workflows
    description: Deterministic multi-engine workflows
  - name: jobs
    description: Durable queued work and lifecycle control
  - name: fusion-worker
    description: Trusted Fusion desktop worker protocol
  - name: kicad-worker
    description: Authenticated KiCad CLI manufacturing worker
paths:
  /metrics:
    get:
      operationId: metricsEndpoint
      tags: [health]
      summary: Prometheus-compatible request metrics
      responses:
        "200": {description: Metrics text, content: {text/plain: {schema: {type: string}}}}
  /readyz:
    get:
      operationId: readinessCheck
      tags: [health]
      security: []
      summary: Readiness probe
      responses:
        "200": {description: Readiness state}
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      security: []
      summary: Register a user account
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AuthRequest"}
      responses:
        "201":
          description: Created account and bearer token
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AuthResponse"}
        "409": {description: Account already exists}
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      security: []
      summary: Log in and receive a bearer token
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AuthRequest"}
      responses:
        "200":
          description: Authenticated account and bearer token
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AuthResponse"}
        "401": {description: Invalid credentials}
  /auth/me:
    get:
      operationId: me
      tags: [auth]
      summary: Return the current account
      responses:
        "200":
          description: Current account
          content:
            application/json:
              schema: {$ref: "#/components/schemas/User"}
        "401": {description: Missing or invalid bearer token}
  /auth/users:
    get:
      operationId: listUsers
      tags: [auth]
      summary: List safe user metadata for administrators
      responses:
        "200": {description: User metadata, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/User"}}}}}
        "403": {description: Administrator role required}
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status including DB and engine status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /chat:
    post:
      operationId: sendChat
      tags: [chat]
      summary: Send a message to Trinity
      description: Routes to the appropriate engine based on query content
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatInput"
      responses:
        "200":
          description: Trinity response with engine-specific data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
  /conversations:
    get:
      operationId: listConversations
      tags: [conversations]
      summary: List all conversations
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Conversation"
    post:
      operationId: createConversation
      tags: [conversations]
      summary: Create a new conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationInput"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
  /conversations/{id}:
    delete:
      operationId: deleteConversation
      tags: [conversations]
      summary: Delete a conversation and all its messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted successfully
  /conversations/{id}/messages:
    get:
      operationId: getMessages
      tags: [conversations]
      summary: Get all messages for a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
  /engines:
    get:
      operationId: listEngines
      tags: [engines]
      summary: List all Trinity engines with status
      responses:
        "200":
          description: Available engines
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Engine"
  /engines/math:
    post:
      operationId: runMathEngine
      tags: [engines]
      summary: Run the Trinity Math Engine directly
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MathInput"
      responses:
        "200":
          description: Math computation result with LaTeX and steps
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MathResponse"
  /engines/quantum:
    post:
      operationId: runQuantumEngine
      tags: [engines]
      summary: Run the Trinity Quantum Lab
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuantumInput"
      responses:
        "200":
          description: Quantum circuit simulation result with Bloch sphere data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuantumResponse"
  /engines/maker/cad:
    post:
      operationId: runMakerCad
      tags: [engines]
      summary: Run the Trinity Maker Engine (CAD)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MakerCadInput"
      responses:
        "200":
          description: Fusion 360 Python script for the requested part
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MakerCadResponse"
  /engines/maker/pcb:
    post:
      operationId: runMakerPcb
      tags: [engines]
      summary: Run the Trinity Maker Engine (PCB)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MakerPcbInput"
      responses:
        "200":
          description: KiCad schematic and PCB layout files
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MakerPcbResponse"
  /engines/literature:
    post:
      operationId: runLiteratureEngine
      tags: [engines]
      summary: Run the Trinity Literature RAG engine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LiteratureInput"
      responses:
        "200":
          description: Research papers and knowledge graph data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiteratureResponse"
  /designs/cad:
    post:
      operationId: createCadDesign
      tags: [designs]
      summary: Create and validate a CAD design job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CadDesignRequest"
      responses:
        "201":
          description: CAD design job with persisted artifacts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DesignJobResponse"
  /designs/pcb:
    post:
      operationId: createPcbDesign
      tags: [designs]
      summary: Create and validate a PCB design job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PcbDesignRequest"
      responses:
        "201":
          description: PCB design job with persisted artifacts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DesignJobResponse"
  /design-jobs/{job_id}:
    get:
      operationId: getDesignJob
      tags: [designs]
      summary: Get a persisted design job
      parameters:
        - name: job_id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Design job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DesignJob"
  /design-jobs/{job_id}/validation:
    get:
      operationId: getDesignJobValidation
      tags: [designs]
      summary: Get design validation details
      parameters:
        - name: job_id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Validation report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationReport"
  /artifacts/{artifact_id}:
    get:
      operationId: downloadArtifact
      tags: [designs]
      summary: Download a generated artifact
      parameters:
        - name: artifact_id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Binary artifact content
          content:
            application/octet-stream: {}
  /firmware/targets:
    get:
      operationId: getFirmwareTargets
      tags: [firmware]
      summary: List registered firmware targets
      responses:
        "200":
          description: Supported target profiles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TargetListResponse"
  /firmware/jobs:
    post:
      operationId: createFirmwareJob
      tags: [firmware]
      summary: Generate a target-specific firmware project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FirmwareRequest"
      responses:
        "201":
          description: Firmware project job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FirmwareJobResponse"
  /firmware/jobs/{job_id}:
    get:
      operationId: getFirmwareJob
      tags: [firmware]
      summary: Get a firmware job
      parameters:
        - name: job_id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Firmware job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FirmwareJobResponse"
  /vision/ocr:
    post:
      operationId: runVisionOcr
      tags: [vision]
      summary: Extract text or LaTeX from an uploaded image
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, conversation_id]
              properties:
                file: {type: string, format: binary}
                description: {type: string}
                conversation_id: {type: integer}
      responses:
        "200":
          description: OCR result
          content:
            application/json:
              schema: {$ref: "#/components/schemas/VisionResult"}
  /collab/sessions/{session_id}:
    get:
      operationId: getCollaborationSession
      tags: [collab]
      summary: Get collaboration session presence
      parameters:
        - name: session_id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Session presence
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CollaborationSession"}
  /ws:
    get:
      operationId: collaborationWebsocket
      tags: [collab]
      summary: WebSocket collaboration endpoint
      parameters:
        - name: session_id
          in: query
          required: false
          schema: {type: string, default: default}
      responses:
        "101": {description: Switching Protocols}
  /kicad/jobs/{job_id}/artifacts:
    post:
      operationId: uploadKicadArtifact
      tags: [kicad-worker]
      summary: Upload a KiCad validation or manufacturing artifact
      parameters:
        - name: job_id
          in: path
          required: true
          schema: {type: string}
        - name: X-Trinity-KiCad-Secret
          in: header
          required: true
          schema: {type: string, format: password}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, kind]
              properties:
                file: {type: string, format: binary}
                kind: {type: string}
      responses:
        "200": {description: Uploaded KiCad artifact}
  /kicad/jobs/{job_id}/complete:
    post:
      operationId: completeKicadJob
      tags: [kicad-worker]
      summary: Complete a PCB job with KiCad validation results
      parameters:
        - name: job_id
          in: path
          required: true
          schema: {type: string}
        - name: X-Trinity-KiCad-Secret
          in: header
          required: true
          schema: {type: string, format: password}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/KicadCompleteRequest"}
      responses:
        "200": {description: Updated PCB design job}
  /workflows/plan:
    post:
      operationId: createWorkflowPlan
      tags: [workflows]
      summary: Build an explicit multi-engine workflow plan
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/WorkflowPlanRequest"}
      responses:
        "200":
          description: Deterministic workflow plan
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WorkflowPlan"}
  /workflows/execute:
    post:
      operationId: executeWorkflow
      tags: [workflows]
      summary: Queue a workflow for approved execution
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/WorkflowExecuteRequest"}
      responses:
        "202":
          description: Queued workflow run
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WorkflowRun"}
  /workflows/runs/{run_id}:
    get:
      operationId: getWorkflowRun
      tags: [workflows]
      summary: Get workflow run and queue status
      parameters:
        - name: run_id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200": {description: Workflow run, content: {application/json: {schema: {$ref: "#/components/schemas/WorkflowRun"}}}}
  /workflows/runs/{run_id}/approve:
    post:
      operationId: approveWorkflow
      tags: [workflows]
      summary: Approve a workflow before engineering actions execute
      parameters:
        - name: run_id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200": {description: Approved workflow run, content: {application/json: {schema: {$ref: "#/components/schemas/WorkflowRun"}}}}
  /workflows/runs/{run_id}/cancel:
    post:
      operationId: cancelWorkflowRun
      tags: [workflows]
      summary: Cancel a queued workflow run
      parameters:
        - name: run_id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200": {description: Cancelled workflow run}
  /jobs:
    get:
      operationId: listJobs
      tags: [jobs]
      summary: List the current user’s durable jobs
      responses:
        "200": {description: Durable jobs, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/DurableJob"}}}}}
    post:
      operationId: createJob
      tags: [jobs]
      summary: Enqueue a durable job
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/JobCreateRequest"}
      responses:
        "202": {description: Enqueued durable job, content: {application/json: {schema: {$ref: "#/components/schemas/DurableJob"}}}}
  /jobs/{job_id}:
    get:
      operationId: readJob
      tags: [jobs]
      summary: Get a durable job
      parameters:
        - name: job_id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200": {description: Durable job, content: {application/json: {schema: {$ref: "#/components/schemas/DurableJob"}}}}
  /jobs/{job_id}/cancel:
    post:
      operationId: cancelJob
      tags: [jobs]
      summary: Cancel a durable job
      parameters:
        - name: job_id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200": {description: Cancelled durable job}
  /fusion/jobs/{job_id}/claim:
    post:
      operationId: claimFusionJob
      tags: [fusion-worker]
      summary: Claim a CAD job from a trusted Fusion worker
      parameters:
        - name: job_id
          in: path
          required: true
          schema: {type: string}
        - name: X-Trinity-Worker-Secret
          in: header
          required: true
          schema: {type: string, format: password}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/FusionClaimRequest"}
      responses:
        "200": {description: Signed Fusion job envelope}
  /fusion/jobs/{job_id}/artifacts:
    post:
      operationId: uploadFusionArtifact
      tags: [fusion-worker]
      summary: Upload a Fusion export artifact
      parameters:
        - name: job_id
          in: path
          required: true
          schema: {type: string}
        - name: X-Trinity-Worker-Secret
          in: header
          required: true
          schema: {type: string, format: password}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, token]
              properties:
                file: {type: string, format: binary}
                token: {type: string}
                kind: {type: string}
      responses:
        "200": {description: Uploaded artifact}
  /fusion/jobs/{job_id}/complete:
    post:
      operationId: completeFusionJob
      tags: [fusion-worker]
      summary: Complete a Fusion job with validation and artifact IDs
      parameters:
        - name: job_id
          in: path
          required: true
          schema: {type: string}
        - name: X-Trinity-Worker-Secret
          in: header
          required: true
          schema: {type: string, format: password}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/FusionCompleteRequest"}
      responses:
        "200": {description: Updated CAD design job}
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Trinity-HMAC
      description: Short-lived HMAC bearer token issued by the account login endpoint.
    TrinityApiKey:
      type: apiKey
      in: header
      name: X-Trinity-Api-Key
      description: Optional in development; required for protected production API endpoints when TRINITY_API_KEY is configured.
  schemas:
    AuthRequest:
      type: object
      required: [email, password]
      properties:
        email: {type: string, format: email}
        password: {type: string, minLength: 8, maxLength: 256, format: password}
    User:
      type: object
      required: [id, email, role]
      properties:
        id: {type: integer}
        email: {type: string, format: email}
        role: {type: string, enum: [user, admin]}
        created_at: {type: [string, "null"], format: date-time}
    AuthResponse:
      type: object
      required: [user, access_token, token_type]
      properties:
        user: {$ref: "#/components/schemas/User"}
        access_token: {type: string}
        token_type: {type: string, enum: [bearer]}
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
        db:
          type: string
        engines:
          type: object
    ChatInput:
      type: object
      required: [content]
      properties:
        content:
          type: string
        conversation_id:
          type: ["integer", "null"]
        engine:
          type: ["string", "null"]
          description: Optional manual specialist-engine selection.
    ChatResponse:
      type: object
      required: [id, content, engine, created_at, conversation_id]
      properties:
        id:
          type: integer
        conversation_id:
          type: integer
        content:
          type: string
        engine:
          type: string
        data:
          type: ["object", "null"]
        created_at:
          type: string
    Conversation:
      type: object
      required: [id, title, created_at, message_count]
      properties:
        id:
          type: integer
        title:
          type: string
        created_at:
          type: string
        updated_at:
          type: string
        message_count:
          type: integer
        last_engine:
          type: ["string", "null"]
    ConversationInput:
      type: object
      properties:
        title:
          type: string
    Message:
      type: object
      required: [id, conversation_id, role, content, created_at]
      properties:
        id:
          type: integer
        conversation_id:
          type: integer
        role:
          type: string
        content:
          type: string
        engine:
          type: ["string", "null"]
        data:
          type: ["object", "null"]
        created_at:
          type: string
    Engine:
      type: object
      required: [id, name, description, status, trigger_words, icon]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        status:
          type: string
        trigger_words:
          type: array
          items:
            type: string
        icon:
          type: string
    MathInput:
      type: object
      required: [expression]
      properties:
        expression:
          type: string
        operation:
          type: string
    MathResponse:
      type: object
      required: [expression, result, engine]
      properties:
        expression:
          type: string
        result:
          type: string
        latex:
          type: string
        steps:
          type: array
          items:
            type: string
        engine:
          type: string
    QuantumInput:
      type: object
      required: [circuit_description]
      properties:
        circuit_description:
          type: string
        num_qubits:
          type: integer
        shots:
          type: integer
    QuantumResponse:
      type: object
      required: [description, engine]
      properties:
        description:
          type: string
        circuit_diagram:
          type: string
        bloch_sphere:
          type: object
        counts:
          type: object
        state_vector:
          type: array
          items:
            type: number
        engine:
          type: string
    MakerCadInput:
      type: object
      required: [description]
      properties:
        description:
          type: string
        parameters:
          type: object
    MakerCadResponse:
      type: object
      required: [description, script, filename, engine]
      properties:
        description:
          type: string
        script:
          type: string
        filename:
          type: string
        instructions:
          type: string
        engine:
          type: string
    MakerPcbInput:
      type: object
      required: [description]
      properties:
        description:
          type: string
        components:
          type: array
          items:
            type: string
    MakerPcbResponse:
      type: object
      required: [description, sch_content, pcb_content, filename, engine]
      properties:
        description:
          type: string
        sch_content:
          type: string
        pcb_content:
          type: string
        filename:
          type: string
        instructions:
          type: string
        engine:
          type: string
    LiteratureInput:
      type: object
      required: [query]
      properties:
        query:
          type: string
        max_results:
          type: integer
    Paper:
      type: object
      required: [title, authors, abstract, url]
      properties:
        title:
          type: string
        authors:
          type: array
          items:
            type: string
        abstract:
          type: string
        url:
          type: string
        published:
          type: string
    LiteratureResponse:
      type: object
      required: [query, papers, summary, engine]
      properties:
        query:
          type: string
        papers:
          type: array
          items:
            $ref: "#/components/schemas/Paper"
        summary:
          type: string
        engine:
          type: string
    ValidationCheck:
      type: object
      required: [name, status, message]
      properties:
        name: {type: string}
        status: {type: string}
        message: {type: string}
        details: {type: object}
    ValidationReport:
      type: object
      required: [status, checks]
      properties:
        status: {type: string}
        checks:
