services:
  frontend:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
    ports:
      - "80:80"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: ../artifacts/api-server
    env_file:
      - .env
    expose:
      - "8000"
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - trinity-data:/srv/data
      - trinity-artifacts:/srv/artifacts
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build:
      context: ../artifacts/api-server
    command: ["python", "-m", "app.job_worker"]
    env_file:
      - .env
    volumes:
      - trinity-data:/srv/data
      - trinity-artifacts:/srv/artifacts
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - trinity-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  trinity-data:
  trinity-artifacts:
  trinity-redis:
