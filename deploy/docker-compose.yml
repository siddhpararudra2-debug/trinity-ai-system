services:
  api:
    build:
      context: ../artifacts/api-server
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - trinity-data:/srv/data
      - trinity-artifacts:/srv/artifacts
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build:
      context: ../artifacts/api-server
    command: ["python", "-m", "app.job_worker"]
    env_file:
      - .env
    volumes:
      - trinity-data:/srv/data
      - trinity-artifacts:/srv/artifacts
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - trinity-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  trinity-data:
  trinity-artifacts:
  trinity-redis:
