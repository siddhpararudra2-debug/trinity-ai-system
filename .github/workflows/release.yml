name: Release

# Builds the standalone Windows distribution on v* tags and attaches the
# release artifacts: portable zip, Inno Setup installer, SHA-256 manifest.
# Nothing is uploaded until every hermetic gate the local scripts enforce
# (PATH-scrubbed native selftest, end-to-end bundle smoke, installed-build
# smoke) has actually passed.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package & Publish Windows Release
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Derive version from tag
        id: ver
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $ver = $tag -replace '^v', ''
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: 'win64_msvc2022_64'
          dir: 'C:/Qt'
          cache: true

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          $vcpkg = $env:VCPKG_INSTALLATION_ROOT
          if (-not $vcpkg) {
            $vcpkg = Join-Path $env:RUNNER_TEMP 'vcpkg'
            git clone --depth 1 https://github.com/microsoft/vcpkg.git $vcpkg
          }
          & (Join-Path $vcpkg 'bootstrap-vcpkg.bat') -disableMetrics
          "VCPKG_ROOT=$vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $binCache = Join-Path $env:RUNNER_TEMP 'vcpkg-binary-cache'
          "VCPKG_DEFAULT_BINARY_CACHE=$binCache" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Prepare vcpkg binary cache
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null

      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-opencv4-${{ runner.os }}-${{ hashFiles('app/native/vcpkg.json') }}
          restore-keys: |
            vcpkg-opencv4-${{ runner.os }}-

      - name: Build native engine (Release + OpenCV)
        working-directory: app/native
        shell: pwsh
        run: |
          cmake --preset windows-release-vcpkg -DCMAKE_PREFIX_PATH="$env:Qt6_Dir"
          cmake --build --preset windows-release-vcpkg

      - name: Native doctests + selftest (Release)
        working-directory: app/native
        shell: pwsh
        run: |
          ctest --preset windows-release-vcpkg
          ./build/release-vcpkg/Release/trinity_tests.exe
          $env:TRINITY_STORAGE_ROOT = "$env:RUNNER_TEMP/trinity-data"
          ./build/release-vcpkg/Release/Trinity.exe --selftest

      - name: Save vcpkg binary cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-opencv4-${{ runner.os }}-${{ hashFiles('app/native/vcpkg.json') }}

      - name: Install Python dependencies (incl. PyInstaller)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Setup Node (frontend static export)
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: "Resolve windeployqt (dir: C:/Qt makes the layout identical to local)"
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $candidates = @('C:/Qt/6.8.3/msvc2022_64/bin/windeployqt.exe')
          if ($env:Qt6_DIR) {
            try {
              $root = (Resolve-Path (Join-Path $env:Qt6_DIR '..\..\..')).Path
              $candidates += (Join-Path $root 'bin/windeployqt.exe')
            } catch { $candidates += ("resolve-failed: {0}" -f $_) }
          }
          $found = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $found) {
            # Definitive diagnosis: dump the runner's Qt state into a public
            # gist (job logs are not readable without a repo token).
            $dump = @("cwd=$(Get-Location)")
            Get-ChildItem env: | Where-Object { $_.Name -match '^QT' -or $_.Name -match '^GITHUB_WORK' -or $_.Name -eq 'Qt6_Dir' } |
              ForEach-Object { $dump += ("{0}={1}" -f $_.Name, $_.Value) }
            foreach ($base in @('C:/Qt', "$env:GITHUB_WORKSPACE/Qt", "$env:RUNNER_TEMP")) {
              if (Test-Path $base) {
                Get-ChildItem $base -Depth 3 -ErrorAction SilentlyContinue |
                  Select-Object -First 60 -ExpandProperty FullName |
                  ForEach-Object { $dump += $_ }
              }
            }
            $dump += "where.exe: $(& where.exe windeployqt.exe 2>$null)"
            $file = Join-Path $env:RUNNER_TEMP "wqt-debug.txt"
            $dump | Set-Content -Path $file -Encoding utf8
            $gist = (& gh gist create -p -f -d "wqt-debug-run-${{ github.run_number }}" $file 2>&1 | Out-String).Trim()
            Write-Output ("::error ::windeployqt NOT FOUND (Qt6_DIR={0})" -f $env:Qt6_DIR)
            Write-Output "::error ::debug gist: $gist"
            [Console]::Out.WriteLine("::error ::gist2: $gist")
            exit 1
          }
          Write-Host ("windeployqt at {0}" -f $found)
          "TRINITY_WINDEPLOYQT=$found" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Assemble portable distribution (bundle + smoke + zip)
        shell: pwsh
        run: |
          $out = & powershell -ExecutionPolicy Bypass -File packaging/package.ps1 `
            -Version ${{ steps.ver.outputs.version }} -WinDeployQt "$env:TRINITY_WINDEPLOYQT" 2>&1
          if ($LASTEXITCODE -ne 0) {
            $tail = (($out | Select-Object -Last 8) -join ' | ')
            for ($i = 0; $i -lt $tail.Length; $i += 480) {
              $len = [Math]::Min(480, $tail.Length - $i)
              Write-Output ("::error ::" + $tail.Substring($i, $len))
            }
            exit 1
          }

      - name: Install Inno Setup (runner has no ISCC)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { Write-Error "choco innosetup install failed"; exit 1 }
          }
          $iscc = @("$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe", "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") |
            Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { Write-Error "ISCC.exe not found after install"; exit 1 }
          Write-Host "ISCC at $iscc"
          "TRINITY_ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build installer (silent-install verified)
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File packaging/build_installer.ps1 -Version ${{ steps.ver.outputs.version }}

      - name: Create SHA-256 manifest
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          $files = @(
            "packaging/dist/TrinityAI-$env:VERSION-win64.zip",
            "packaging/dist/TrinityAI-$env:VERSION-win64-setup.exe"
          )
          foreach ($f in $files) {
            if (-not (Test-Path $f)) { Write-Error "missing artifact: $f"; exit 1 }
          }
          Get-FileHash $files -Algorithm SHA256 | ForEach-Object {
            "{0}  {1}" -f ($_.Hash.ToLower()), (Split-Path $_.Path -Leaf)
          } | Set-Content packaging/dist/SHA256SUMS.txt -Encoding Ascii
          Get-Content packaging/dist/SHA256SUMS.txt

      - name: Attach artifacts to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          gh release view "v$env:VERSION" 2>$null; if ($LASTEXITCODE -ne 0) {
            gh release create "v$env:VERSION" --title "Trinity AI $env:VERSION" --notes "See work.md and README for what is inside this release."
          }
          gh release upload "v$env:VERSION" --clobber `
            "packaging/dist/TrinityAI-$env:VERSION-win64.zip" `
            "packaging/dist/TrinityAI-$env:VERSION-win64-setup.exe" `
            "packaging/dist/SHA256SUMS.txt"
