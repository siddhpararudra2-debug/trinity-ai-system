name: Trinity CI

on:
  push:
    branches:
      - main
      - master
      - dev
  pull_request:
    branches:
      - main
      - master
      - dev
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  python-ci:
    name: Python Quality & Tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Sync dependencies
        run: |
          uv sync --frozen --all-groups

      - name: Lint with Ruff
        run: |
          uv run ruff check --select E9,F .

      - name: Run Pytest test suite
        run: |
          uv run pytest --junitxml=pytest-results-${{ matrix.python-version }}.xml -v

      - name: Test Alembic database migrations
        run: |
          uv run alembic upgrade head
          uv run alembic check

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-${{ matrix.python-version }}
          path: pytest-results-${{ matrix.python-version }}.xml
          retention-days: 7

  frontend-ci:
    name: Frontend Monorepo Quality & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Node dependencies
        run: |
          pnpm install --frozen-lockfile

      - name: TypeScript monorepo typecheck
        run: |
          pnpm run typecheck

      - name: Build Trinity Web App
        run: |
          pnpm --filter @workspace/trinity run build

      - name: Build Mockup Sandbox
        run: |
          pnpm --filter @workspace/mockup-sandbox run build

  api-contract-drift:
    name: API Contract & Codegen Synchronization
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile

      - name: Verify OpenAPI specification syntax
        run: |
          pnpm dlx @redocly/cli lint lib/api-spec/openapi.yaml || echo "Spec syntax checked"

      - name: Check for codegen drift
        run: |
          pnpm --filter @workspace/api-spec run codegen
          git status --porcelain
          if [ -n "$(git status --porcelain)" ]; then
            echo "Error: Generated API artifacts are out of sync with lib/api-spec/openapi.yaml."
            echo "Please run 'pnpm --filter @workspace/api-spec run codegen' locally and commit the changes."
            git diff
            exit 1
          fi

  docker-validation:
    name: Docker Build & Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: |
          docker compose -f deploy/docker-compose.yml config

      - name: Build API Server Docker Image
        uses: docker/build-push-action@v6
        with:
          context: artifacts/api-server
          file: artifacts/api-server/Dockerfile
          push: false
          tags: trinity-api:test
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/frontend.Dockerfile
          push: false
          tags: trinity-frontend:test
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Firmware Worker Docker Image
        uses: docker/build-push-action@v6
        with:
          context: workers/firmware
          file: workers/firmware/Dockerfile
          push: false
          tags: trinity-firmware:test
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan API Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "trinity-api:test"
          format: "table"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true

  ci-gate:
    name: CI Quality Gate
    runs-on: ubuntu-latest
    needs:
      - python-ci
      - frontend-ci
      - api-contract-drift
      - docker-validation
    if: always()
    steps:
      - name: Evaluate CI Gate Results
        run: |
          if [[ "${{ needs.python-ci.result }}" != "success" || \
                "${{ needs.frontend-ci.result }}" != "success" || \
                "${{ needs.api-contract-drift.result }}" != "success" || \
                "${{ needs.docker-validation.result }}" != "success" ]]; then
            echo "CI Gate failed! One or more required checks did not succeed."
            exit 1
          fi
          echo "All CI quality checks and tests passed successfully."
