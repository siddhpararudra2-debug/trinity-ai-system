name: CI

on:
  push:
    branches:
      - main
      - master
      - dev
      - push-to-trinity
  pull_request:
    branches:
      - main
      - master
      - dev
      - push-to-trinity
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install -e . pytest ruff==0.16.8 httpx pyyaml python-multipart
      - name: Run pytest (full log kept for debugging from a machine without repo token)
        run: |
          python -m pytest tests -v 2>&1 | tee pytest.log
          test ${PIPESTATUS[0]} -eq 0
      - name: Emit pytest tail as annotations
        if: failure()
        run: |
          tail -30 pytest.log | sed 's/%/%25/g; s/\r//g' | fold -s -w 500 | sed 's/^/::error ::/' | head -10

      - name: Upload pytest log
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: pytest-backend-log
          path: pytest.log
      - run: ruff check src tests

  validate:
    name: Build & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

  cad-kernel:
    name: STEP kernel (OpenCascade)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      # cadquery pulls ~1 GB of wheels, which is why it is an extra rather
      # than a core requirement and why this is its own job: the fast
      # backend job should not pay for it.
      - run: python -m pip install -e ".[cad]" pytest

      - name: Run STEP kernel tests
        run: python -m pytest tests/test_cad_step_kernel.py -v

      # A skip also exits 0, so "pytest passed" does not prove the kernel
      # ran. Before this job the STEP path was verified only on whichever
      # machine happened to have cadquery installed -- the most technically
      # involved code in the repo was the least continuously checked.
      # Assert the tests executed, not merely that nothing failed.
      - name: Confirm the kernel tests ran rather than skipped
        run: |
          set -euo pipefail
          python -m pytest tests/test_cad_step_kernel.py -v 2>&1 | tee step.log
          if grep -qE "SKIPPED|skipped" step.log; then
            echo "::error::STEP kernel tests were skipped -- OpenCascade is not actually available"
            exit 1
          fi
          if grep -q "PASSED\|passed" step.log; then
            echo "STEP kernel tests executed"
          else
            echo "::error::no STEP kernel tests reported a result"
            exit 1
          fi
