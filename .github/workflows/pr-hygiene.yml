name: PR Hygiene & Governance

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions:
  pull-requests: write
  contents: read

jobs:
  lint-pr-title:
    name: Lint PR Title (Conventional Commits)
    runs-on: ubuntu-latest
    # Dependabot owns its generated title format; human-authored PRs must use
    # the conventional-commit types listed below.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    steps:
      - name: Validate Conventional Commits format
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          ignoreLabels: |
            bot
            ignore-semantic-pull-request

  auto-label:
    name: Auto Label PR by Area
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Label based on modified files
        uses: actions/labeler@v5
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          sync-labels: true
          configuration-path: .github/labeler.yml
